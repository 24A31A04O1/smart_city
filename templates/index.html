
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Civic Admin Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1f2937, #111827);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 15px;
      color: #d1d5db;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .card {
      background: #ffffff;
      color: #111827;
      border-radius: 18px;
      padding: 26px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 60px rgba(0,0,0,0.35);
    }

    .icon {
      font-size: 36px;
      margin-bottom: 14px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    .card a {
      display: inline-block;
      padding: 10px 20px;
      background: #4f46e5;
      color: #fff;
      text-decoration: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .card a:hover {
      background: #4338ca;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>🏛 Civic Admin Portal</h1>
      <p>Select your role to continue</p>
    </div>

    <!-- LOGIN OPTIONS -->
    <div class="card-grid">

      <div class="card">
        <div class="icon">🏠</div>
        <h2>Place Admin</h2>
        <p>Manage issues reported in your place</p>
        <a href="/place/login">Login</a>
      </div>

      <div class="card">
        <div class="icon">🗳️</div>
        <h2>Constituency Admin</h2>
        <p>Handle escalated and constituency-wide issues</p>
        <a href="/constituency/login">Login</a>
      </div>

      

      <div class="card">
        <div class="icon">🏢</div>
        <h2>Department Admin</h2>
        <p>Resolve department-specific civic problems</p>
        <a href="/department/login">Login</a>
      </div>

    </div>

    <!-- FOOTER -->
    <footer>
      © 2027 Civic Issue Management System
    </footer>

  </div>

</body>
</html>
